services:
  attendance_mysql:
    image: mysql:8.0
    container_name: attendance_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Ai_attendance
      MYSQL_USER: ai_attendance
      MYSQL_PASSWORD: 2003
    ports:
      - "3306:3306"
    volumes:
      - mysql_storage:/var/lib/mysql

  attendance_typesense:
    image: typesense/typesense:27.1
    container_name: attendance_typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: xyz123
      TYPESENSE_DATA_DIR: /data
    ports:
      - "8109:8108"
    volumes:
      - typesense_storage:/data

volumes:
  mysql_storage:
  typesense_storage: