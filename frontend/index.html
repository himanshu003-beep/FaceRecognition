<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Attendance Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 9999px;
            background-color: #1e293b;
            border: 1px solid #334155;
        }
        .logout-btn {
            background-color: #334155;
            color: #cbd5e1;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .logout-btn:hover {
            background-color: #ef4444;
            color: #ffffff;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px 20px;
        }
        .card h3 {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
        }
        .table-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: visible; /* Hover zoom ko cut na kare isliye visible rakha */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        thead {
            background-color: #0f172a;
        }
        th, td {
            padding: 14px 16px;
            font-size: 14px;
            vertical-align: middle;
        }
        th {
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid #334155;
        }
        tbody tr {
            border-bottom: 1px solid #334155;
        }
        tbody tr:last-child {
            border-bottom: none;
        }
        tbody tr:hover {
            background-color: #1a2436;
        }

        /* ----------------- AVATAR & HOVER ZOOM STYLES ----------------- */
        .avatar-box {
            position: relative;
            width: 42px;
            height: 42px;
        }
        .avatar-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, border-color 0.2s;
            position: relative;
            z-index: 1;
        }
        /* Mouse hover hone par circle zoom */
        .avatar-img:hover {
            transform: scale(2.4);
            z-index: 100;
            border: 2px solid #60a5fa;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .avatar-fallback {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #334155;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-in {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .badge-out {
            background-color: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Face Attendance Dashboard</h1>
        <div class="header-actions">
            <div id="statusIndicator" class="status-badge">
                <span style="color: #eab308;">Connecting...</span>
            </div>
            <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <div class="cards-grid">
        <div class="card">
            <h3>Total Records</h3>
            <p id="totalRecords">0</p>
        </div>
        <div class="card">
            <h3>Currently In Office</h3>
            <p id="currentlyInOffice" style="color: #4ade80;">0</p>
        </div>
        <div class="card">
            <h3>Checked Out</h3>
            <p id="checkedOut" style="color: #94a3b8;">0</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th style="width: 70px;">Photo</th>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Login Time (IST)</th>
                    <th>Logout Time (IST)</th>
                    <th>Duration</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr>
                    <td colspan="8" style="text-align: center; color: #94a3b8;">Loading attendance data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
